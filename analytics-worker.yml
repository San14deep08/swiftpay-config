# SwiftPay — analytics-worker (Service C, BONUS)
# Requirement IDs: FR-19, FR-20
# Lowest priority (CON-15). Mock OLAP table rather than ClickHouse — DD-10.

server:
  port: ${ANALYTICS_WORKER_PORT:8083}

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:55432/swiftpay}
    username: ${POSTGRES_USER:swiftpay}
    password: ${POSTGRES_PASSWORD:swiftpay}
    hikari:
      schema: analytics
      pool-name: analytics-hikari
      maximum-pool-size: ${ANALYTICS_DB_POOL:10}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: analytics
        jdbc:
          batch_size: 200         # append-only fact writes batch well
        order_inserts: true

  flyway:
    enabled: true
    schemas: analytics
    default-schema: analytics
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: analytics-ingest
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate

swiftpay:
  topics:
    payments-completed: swiftpay.payments.completed.v1

logging:
  level:
    analytics_worker: DEBUG
