# SwiftPay — api-gateway (Spring Cloud Gateway, reactive / WebFlux)
# Requirement IDs: NONE — architecture demonstration only. See docs/02-system-design.md §0.1, DD-14.
#
# HARD RULE: routing only. No validation, no idempotency, no balance checks, no persistence.
# gateway-service owns every money decision (FR-02, FR-03, FR-08). If business logic appears
# here, there are two places that decide about money, and that is the bug.

server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        # PREFIX VERIFIED 2026-09-15 against Spring Cloud 2025.1.3 by declaring both the
        # classic `spring.cloud.gateway.routes` and this namespaced form with distinct route
        # ids and reading /actuator/gateway/routes: only these bound. The classic prefix is
        # silently ignored on this version — it produces a gateway that starts cleanly and
        # routes nothing.
        webflux:
          routes:
            - id: payments
              uri: lb://GATEWAY-SERVICE
              predicates:
                - Path=/v1/payments/**

            - id: accounts
              uri: lb://LEDGER-SERVICE
              predicates:
                - Path=/v1/accounts/**

            - id: analytics
              uri: lb://ANALYTICS-WORKER
              predicates:
                - Path=/v1/analytics/**

      # Explicitly OFF. The discovery locator auto-creates a route per registered service at
      # /SERVICE-NAME/**, exposing every service under a second, undocumented URL that appears
      # in no OpenAPI spec (NFR-01). Routes here are declared, not inferred.
      discovery:
        locator:
          enabled: false

management:
  endpoints:
    web:
      # Overrides the shared base-path: / from application.yml. Actuator stays under /actuator
      # here so it cannot collide with a gateway route at the root.
      base-path: /actuator
      exposure:
        # Must be restated here, including "gateway": config-server properties override a
        # service's local application.yml, and this file overrides the shared application.yml.
        # The shared file sets exposure.include; when this one did not, the shared value won
        # and silently dropped the gateway endpoint.
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      # Exposure and access are TWO separate gates. Spring Boot 3.4 replaced
      # management.endpoint.<id>.enabled with .access; an exposed endpoint still 404s while
      # access defaults to none. Verified: adding this turned the 404 into [].
      access: unrestricted

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

logging:
  level:
    api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
