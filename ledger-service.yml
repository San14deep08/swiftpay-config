# SwiftPay — ledger-service (Service B)
# Requirement IDs: FR-11..FR-18, NFR-03, NFR-04
# The ONLY writer of money. See docs/02-system-design.md DD-03, DD-05, DD-07.

server:
  port: ${LEDGER_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:55432/swiftpay}
    username: ${POSTGRES_USER:swiftpay}
    password: ${POSTGRES_PASSWORD:swiftpay}
    hikari:
      schema: ledger
      pool-name: ledger-hikari
      # Settlement holds row locks, so an oversized pool just queues inside Postgres.
      # Starting point only — Phase 8 measures it (NFR-13).
      maximum-pool-size: ${LEDGER_DB_POOL:20}
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledger
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    schemas: ledger
    default-schema: ledger
    create-schemas: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ledger-settlement
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # Must exceed the retry back-off ceiling below, or a DB outage triggers a rebalance
        # mid-outage. See DD-08 — the pausing back-off handler alternative is still to be
        # confirmed against Spring Kafka's version in Spring Cloud 2025.1.3.
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual_immediate
      concurrency: ${LEDGER_CONSUMER_CONCURRENCY:6}

swiftpay:
  settlement:
    # DD-03 — pessimistic row locks, deterministic order, READ COMMITTED.
    lock-timeout: 3s
  retry:
    # DD-08 — RETRYABLE infrastructure faults: back off, never DLQ, never lose a message.
    initial-interval: 1s
    multiplier: 2.0
    max-interval: 30s
    max-attempts: -1              # unbounded; the outage ends, the backlog drains
  dlq:
    # DD-08 — NON-RETRYABLE poison messages only.
    topic: swiftpay.payments.initiated.v1.DLT
  outbox:
    poll-interval: 100ms
    batch-size: 500
  topics:
    payments-initiated: swiftpay.payments.initiated.v1
    payments-completed: swiftpay.payments.completed.v1
    payments-failed: swiftpay.payments.failed.v1

logging:
  level:
    ledger_service: DEBUG
